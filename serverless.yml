service: wellnesslab-backend
useDotenv: true

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  stage: dev
  timeout: 30
  memorySize: 512
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'image/*'
      - '*/*'
  environment:
    DATABASE_URL: ${env:DATABASE_URL, ''}
    DIRECT_URL: ${env:DIRECT_URL, ''}
    CLERK_SECRET_KEY: ${env:CLERK_SECRET_KEY, ''}
    CLERK_PUBLISHABLE_KEY: ${env:CLERK_PUBLISHABLE_KEY, ''}
    SUPABASE_URL: ${env:SUPABASE_URL, ''}
    SUPABASE_JWT_SECRET: ${env:SUPABASE_JWT_SECRET, ''}
    CLOUDINARY_CLOUD_NAME: ${env:CLOUDINARY_CLOUD_NAME, ''}
    CLOUDINARY_API_KEY: ${env:CLOUDINARY_API_KEY, ''}
    CLOUDINARY_API_SECRET: ${env:CLOUDINARY_API_SECRET, ''}
    STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    EMAIL_HOST: ${env:EMAIL_HOST, ''}
    EMAIL_PORT: ${env:EMAIL_PORT, ''}
    EMAIL_SECURE: ${env:EMAIL_SECURE, ''}
    EMAIL_USER: ${env:EMAIL_USER, ''}
    EMAIL_PASS: ${env:EMAIL_PASS, ''}
    FRONTEND_URL: ${env:FRONTEND_URL, ''}
    CLIENT_URL: ${env:CLIENT_URL, ''}
    NAJAH_FRONTEND_URL: ${env:NAJAH_FRONTEND_URL, ''}
    NAJAH_EMAIL_USER: ${env:NAJAH_EMAIL_USER, ''}
    NAJAH_EMAIL_PASS: ${env:NAJAH_EMAIL_PASS, ''}
    NAJAH_EMAIL_RECEIVER: ${env:NAJAH_EMAIL_RECEIVER, ''}
    OPENWA_API_URL: ${env:OPENWA_API_URL, ''}
    OPENWA_API_KEY: ${env:OPENWA_API_KEY, ''}
    OPENWA_SESSION_ID: ${env:OPENWA_SESSION_ID, ''}
    MARKETING_HOST: ${env:MARKETING_HOST, ''}
    MARKETING_EMAIL_PORT: ${env:MARKETING_EMAIL_PORT, ''}
    MARKETING_EMAIL_SECURE: ${env:MARKETING_EMAIL_SECURE, ''}
    MARKETING_EMAIL_USER: ${env:MARKETING_EMAIL_USER, ''}
    MARKETING_EMAIL_PASS: ${env:MARKETING_EMAIL_PASS, ''}
    APIFY_API_TOKEN: ${env:APIFY_API_TOKEN, ''}
    APIFY_GOOGLE_MAPS_ACTOR: ${env:APIFY_GOOGLE_MAPS_ACTOR, ''}
    API_URL: ${env:API_URL, ''}
    META_ACCESS_TOKEN: ${env:META_ACCESS_TOKEN, ''}
    META_AD_ACCOUNT_ID: ${env:META_AD_ACCOUNT_ID, ''}
    CTWA_GOWA_API_URL: ${env:CTWA_GOWA_API_URL, 'http://3.110.175.249:3000'}
    CTWA_WEBHOOK_URL: ${env:CTWA_WEBHOOK_URL, 'https://alb-backend.thewellnesslab.ae/api/ctwa/webhook'}
    CTWA_VERIFY_TOKEN: ${env:CTWA_VERIFY_TOKEN, 'wellnesslab_ctwa_token'}
    GOWA_BASIC_USER: ${env:GOWA_BASIC_USER, 'user1'}
    GOWA_BASIC_PASS: ${env:GOWA_BASIC_PASS, 'pass1'}
    GOWA_DEVICE_ID: ${env:GOWA_DEVICE_ID, 'adil'}
    AUTO_REPLY_DELAY_MS: ${env:AUTO_REPLY_DELAY_MS, '2000'}
    PAYMOB_API_KEY: ${env:PAYMOB_API_KEY, ''}
    PAYMOB_PUBLIC_API_KEY: ${env:PAYMOB_PUBLIC_API_KEY, ''}
    PAYMOB_PRIVATE_API_KEY: ${env:PAYMOB_PRIVATE_API_KEY, ''}
    PAYMOB_INTEGRATION_ID: ${env:PAYMOB_INTEGRATION_ID, ''}
    PAYMOB_IFRAME_ID: ${env:PAYMOB_IFRAME_ID, ''}
    PAYMOB_HMAC_SECRET: ${env:PAYMOB_HMAC_SECRET, ''}

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    target: node20
    platform: node
    format: cjs
    outputFileExtension: .js
    external:
      - '@prisma/client'
      - '@prisma/engines'
      - '.prisma/client'

package:
  individually: false
  patterns:
    - 'package.json'
    - 'prisma/schema.prisma'
    - 'node_modules/@prisma/client/**'
    - 'node_modules/.prisma/client/schema.prisma'
    - 'node_modules/.prisma/client/index.js'
    - 'node_modules/.prisma/client/default.js'
    - 'node_modules/.prisma/client/libquery_engine-rhel-openssl-3.0.x.so.node'
    - '!node_modules/@prisma/engines/**'
    - '!node_modules/.prisma/client/libquery_engine-windows*'
    - '!node_modules/.prisma/client/libquery_engine-darwin*'
    - '!node_modules/.prisma/client/libquery_engine-debian*'

functions:
  api:
    handler: src/lambda.handler
    events:
      - http:
          path: '/'
          method: ANY
          cors: true
      - http:
          path: '/{proxy+}'
          method: ANY
          cors: true
